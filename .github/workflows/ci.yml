name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: work
          POSTGRES_PASSWORD: work
          POSTGRES_DB: work_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U work -d work_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:setup
        env:
          DATABASE_URL: postgresql://work:work@localhost:5432/work_platform
          NODE_ENV: production
          PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm test:e2e:postgres
        env:
          DATABASE_URL: postgresql://work:work@localhost:5432/work_platform
          RUN_POSTGRES_E2E: true
          PLATFORM_REPOSITORY_DRIVER: postgres
          PLATFORM_BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f infra/docker-compose.prod.yml build
